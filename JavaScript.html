<script>
/**
 * Skills-First Journey Tracker — client app.
 *
 * Ported from the Claude Design prototype (SkillsFirstJourney.dc.html). The
 * render code below is intentionally close to a line-for-line port of the
 * prototype (per the design_handoff README: "recreate pixel-perfectly...
 * keep the exact state variables and render code"). What changed is the
 * DATA LAYER ONLY: everything that used to read/write localStorage or fetch
 * a published CSV now calls a server function (Auth.gs / SheetData.gs /
 * Activity.gs / Settings.gs / Favorites.gs / Overrides.gs / Code.gs) via
 * google.script.run, so the Google Sheet is the single shared source of
 * truth and auth/activity/roles are enforced server-side.
 */
(function () {
  var h = React.createElement, F = React.Fragment;

  var DEFAULT_STAGES = ["Hasn't begun the Journey", "Starting the Journey", "On the Journey", "Leading the Journey"];
  var DEFAULT_CATS = [
    { key: 'laborMarket', label: 'Labor Market-shaping' },
    { key: 'aiHiring', label: 'AI-driven Hiring' },
    { key: 'riskCompliance', label: 'Risk & Compliance' },
    { key: 'internalMobility', label: 'Internal Mobility & Reskilling' },
    { key: 'vendorEcosystem', label: 'Vendor & Ecosystem Influence' },
    { key: 'narrative', label: 'Narrative Normalization' },
  ];

  class App extends React.Component {
    get STAGES() { return (this.state.stages && this.state.stages.length) ? this.state.stages : DEFAULT_STAGES; }
    get CATS() { return (this.state.categoryKeys && this.state.categoryKeys.length) ? this.state.categoryKeys : DEFAULT_CATS; }
    get DEFS() { return this.state.definitions || []; }
    get RES() { return this.state.resources || { universalMenu: [], turnkey: [], exclusive: [] }; }
    get ENG() { return this.state.engagement || []; }

    stageDef(stage) { const d = this.DEFS.find(x => x.defType === 'Journey Definition' && x.category === stage); return d ? d.definition : ''; }
    catStageDef(catLabel, stage) {
      const map = { 'Labor Market-shaping': 'Labor Market-shaping Behavior' };
      const dt = map[catLabel] || catLabel;
      const d = this.DEFS.find(x => x.defType === dt && x.category === stage);
      return d ? d.definition : '';
    }
    stageColor(s) {
      return {
        "Hasn't begun the Journey": "#9aa0b4",
        "Starting the Journey": "#ffae32",
        "On the Journey": "#56adde",
        "Leading the Journey": "#8c4799",
      }[s] || "#9aa0b4";
    }
    stageShort(s) {
      return {
        "Hasn't begun the Journey": "Hasn't begun",
        "Starting the Journey": "Starting",
        "On the Journey": "On the journey",
        "Leading the Journey": "Leading",
      }[s] || s;
    }

    norm(c) {
      const cats = c.categories || {};
      (this.CATS).forEach(k => { if (!cats[k.key]) cats[k.key] = { cls: this.STAGES[0], why: "" }; });
      return Object.assign({
        id: c.id || ('c' + Math.random().toString(36).slice(2, 8)),
        company: "", logo: "", ttpc: false, adCouncil: false,
        overall: "", overallWhy: "", doneTogether: "", owner: "",
        international: "", edgeFlags: "", assessmentDate: "", sources: [], readinessScore: null,
        top10: false, top10Notes: "", pointsOfContact: [], engagementIdeas: [],
        lastChangeDirection: "", lastReassessed: "", latestChangeSummary: "", previousAssessments: [],
        board: [], industry: "", website: "", parentNote: "",
      }, c, { categories: cats });
    }

    constructor(props) {
      super(props);
      this.token = '';
      try { this.token = localStorage.getItem('sfj_token') || ''; } catch (e) {}
      this.state = {
        loading: true, bootError: '',
        companies: [], engagement: [], definitions: [], resources: null,
        stages: [], categoryKeys: [],
        view: 'cards', q: '', membership: 'all', industryFilter: 'all',
        stageFilter: {}, sort: { key: 'company', dir: 1 },
        selectedId: null, editing: null, isNew: false, toast: '',
        selected: {}, shareOpen: false, shareTo: '', shareMsg: '', shareDetail: 'summary',
        page: 'journey', engQ: '', engSort: { key: 'total', dir: -1 }, engExpanded: {},
        auth: null, admins: [], activity: [],
        favorites: {}, showFav: false, sending: false,
        settings: { title: 'Skills-First Journey Tracker', accent: '#8c4799' },
        loginEmail: '', loginPass: '', naName: '', naEmail: '', naPass: '', dataText: '',
        memberName: '', memberEmail: '',
        syncing: false, assessmentTab: 'current', engDetail: null, liveSync: null,
        commentCounts: {}, comments: {}, commentDraft: '', commentsLoadingFor: null,
        oppDrafts: {},
        adminLoginOpen: false,
      };
      this.fileRef = React.createRef();
    }

    componentDidMount() { this.bootstrap(); }

    // ---------- bootstrap / server bridge ----------
    bootstrap() {
      this.setState({ loading: true, bootError: '' });
      google.script.run
        .withSuccessHandler(res => {
          if (!res.auth) { this.token = ''; try { localStorage.removeItem('sfj_token'); } catch (e) {} }
          this.setState({
            loading: false, auth: res.auth, companies: res.companies || [], engagement: res.engagement || [],
            definitions: res.definitions || [], resources: res.resources, settings: res.settings || this.state.settings,
            stages: res.stages || DEFAULT_STAGES, categoryKeys: res.categoryKeys || DEFAULT_CATS,
            favorites: res.favorites || {}, admins: res.admins || [], activity: res.activity || [],
            commentCounts: res.commentCounts || {},
          });
        })
        .withFailureHandler(err => this.setState({ loading: false, bootError: (err && err.message) || String(err) }))
        .api_bootstrap(this.token);
    }
    refreshFromSheet() {
      this.setState({ syncing: true });
      google.script.run
        .withSuccessHandler(res => { this.setState({ companies: res.companies, engagement: res.engagement, syncing: false, liveSync: { ok: true, at: Date.now() } }); this.flash('Refreshed from the Google Sheet'); })
        .withFailureHandler(err => { this.setState({ syncing: false, liveSync: { ok: false, at: Date.now(), error: (err && err.message) || String(err) } }); this.flash('Refresh failed — showing last-known data.'); })
        .api_refresh(this.token);
    }
    refreshActivity() {
      google.script.run.withFailureHandler(() => {}).withSuccessHandler(activity => this.setState({ activity })).api_getActivity(this.token);
    }

    track(action, target) {
      if (!this.state.auth) return;
      google.script.run.withFailureHandler(() => {}).api_track(this.token, action, target || '');
    }
    openCompany(id) {
      const c = this.state.companies.find(x => x.id === id);
      this.track('Viewed company', c ? c.company : id);
      this.setState({ selectedId: id, assessmentTab: 'current', commentDraft: '' });
      // Comments are open to everyone who's entered the site (see
      // entryScreen/api_enter) — this.state.auth is always set by the time
      // openCompany can be called, since the entry gate blocks rendering
      // otherwise.
      this.loadComments(id);
    }
    // ---------- comments (live, shared — stored in the "Comments" sheet tab, never localStorage) ----------
    loadComments(id) {
      this.setState({ commentsLoadingFor: id });
      google.script.run
        .withSuccessHandler(list => this.setState(s => ({ comments: Object.assign({}, s.comments, { [id]: list }), commentsLoadingFor: s.commentsLoadingFor === id ? null : s.commentsLoadingFor })))
        .withFailureHandler(() => this.setState(s => ({ commentsLoadingFor: s.commentsLoadingFor === id ? null : s.commentsLoadingFor })))
        .api_getComments(this.token, id);
    }
    addComment(id) {
      const text = (this.state.commentDraft || '').trim();
      if (!text) return;
      google.script.run
        .withSuccessHandler(res => this.setState(s => ({ comments: Object.assign({}, s.comments, { [id]: res.comments }), commentCounts: res.commentCounts, commentDraft: '' })))
        .withFailureHandler(err => this.flash('Could not post comment: ' + ((err && err.message) || err)))
        .api_addComment(this.token, id, text);
    }
    // ---------- priority prospect opportunities (live, shared — "Priority Prospect Opportunities" sheet tab) ----------
    addOpportunity(id, companyName) {
      const text = ((this.state.oppDrafts || {})[id] || '').trim();
      if (!text) return;
      google.script.run
        .withSuccessHandler(res => this.setState(s => ({
          companies: s.companies.map(c => c.id === id ? Object.assign({}, c, { engagementIdeas: res.engagementIdeas }) : c),
          oppDrafts: Object.assign({}, s.oppDrafts, { [id]: '' }),
        })))
        .withFailureHandler(err => this.flash('Could not add opportunity: ' + ((err && err.message) || err)))
        .api_addOpportunity(this.token, companyName, text);
    }
    downloadCompany(id) {
      const c = this.state.companies.find(x => x.id === id); if (!c) return;
      const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cats = (this.CATS || []).map(k => { const cc = c.categories[k.key] || {}; if (!cc.cls && !cc.why) return ''; return '<div style="border:1px solid #e5e2ea;border-radius:10px;padding:12px 14px;margin:0 0 8px"><div style="font-weight:500">' + esc(k.label) + ' &middot; <span style="color:#8c4799">' + esc(cc.cls || '—') + '</span></div>' + (cc.why ? '<div style="font-size:13px;color:#4a4e60;margin-top:4px">' + esc(cc.why) + '</div>' : '') + '</div>'; }).join('');
      const src = (c.sources || []).map((s, i) => (i + 1) + '. <a href="' + esc(s) + '" style="color:#8c4799">' + esc(s) + '</a>').join('<br>');
      const board = (c.board || []).map(m => esc(m.name) + (m.title ? ' — ' + esc(m.title) : '') + (m.role ? ' (' + esc(m.role) + (m.ec ? ', Exec Committee' : '') + ')' : '')).join('<br>');
      // Per project rule (CLAUDE.md): never include "Where things stand now", edge case
      // flags, or account owner in anything shared/downloaded — omitted below on purpose.
      const html = '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(c.company) + ' — Skills-First Journey</title></head>'
        + '<body style="font-family:DM Sans,-apple-system,Segoe UI,Arial,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;color:#0f153b;background:#fff">'
        + '<div style="font-size:22px;font-weight:600;letter-spacing:-.02em">Opportunity<span style="color:#8c4799">@</span>Work</div>'
        + '<div style="height:1px;background:#e5e2ea;margin:16px 0 24px"></div>'
        + '<div style="color:#8c4799;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">Skills-First Journey Tracker</div>'
        + '<h1 style="font-weight:500;letter-spacing:-.03em;font-size:30px;margin:8px 0 12px">' + esc(c.company) + '</h1>'
        + '<p style="font-size:14px;color:#4a4e60;margin:0 0 20px"><b style="color:#0f153b">' + esc(c.overall || 'Not yet assessed') + '</b>' + (c.industry ? ' &middot; ' + esc(c.industry) : '') + (c.ttpc ? ' &middot; TTPC Coalition partner' : '') + (c.adCouncil ? ' &middot; Ad Council board' : '') + (c.assessmentDate ? ' &middot; Assessed ' + esc(c.assessmentDate) : '') + '</p>'
        + (c.overallWhy ? '<p style="font-size:15px;line-height:1.6">' + esc(c.overallWhy) + '</p>' : '')
        + (cats ? '<h3 style="font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f80">Dimension classifications</h3>' + cats : '')
        + (c.doneTogether ? '<h3 style="font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f80">What we’ve done together</h3><p style="font-size:15px;line-height:1.6">' + esc(c.doneTogether) + '</p>' : '')
        + (board ? '<h3 style="font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f80">Ad Council board</h3><p style="font-size:15px;line-height:1.6">' + board + '</p>' : '')
        + (c.international ? '<h3 style="font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f80">International context</h3><p style="font-size:15px;line-height:1.6">' + esc(c.international) + '</p>' : '')
        + (src ? '<h3 style="font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f80">Sources</h3><p style="font-size:13px;line-height:1.8">' + src + '</p>' : '')
        + '<div style="height:1px;background:#e5e2ea;margin:24px 0 12px"></div><div style="font-size:12px;color:#9aa0b4">Opportunity@Work — Skills-First Journey Tracker</div>'
        + '</body></html>';
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = c.company.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-skills-first.html'; a.click();
      this.track('Downloaded company', c.company); this.flash('Downloaded ' + c.company);
    }
    isFav(id) { return !!(this.state.favorites && this.state.favorites[id]); }
    toggleFavorite(id) {
      const f = Object.assign({}, this.state.favorites);
      if (f[id]) delete f[id]; else f[id] = true;
      this.setState({ favorites: f });
      google.script.run.withFailureHandler(() => {}).withSuccessHandler(res => this.setState({ favorites: res.favorites })).api_toggleFavorite(this.token, id);
    }
    sendEmail() {
      const { rows, body } = this.shareText(this.state.shareDetail);
      if (!rows.length) return;
      const to = (this.state.shareTo || '').trim();
      if (!to) { this.flash('Enter a recipient email address'); return; }
      const msg = this.state.shareMsg.trim();
      const subject = 'Skills-first journey — ' + rows.length + (rows.length === 1 ? ' company' : ' companies');
      const text = (msg ? msg + '\n\n' : '') + body;
      this.setState({ sending: true });
      google.script.run
        .withSuccessHandler(() => { this.setState({ sending: false, shareOpen: false, selected: {} }); this.flash('Email sent to ' + to); })
        .withFailureHandler(err => { this.setState({ sending: false }); this.flash('Send failed (' + ((err && err.message) || err) + ') — opening a draft instead'); this.openEmail(); })
        .api_sendEmail(this.token, to, subject, text);
    }
    // ---------- entry gate (domain-restricted, no password) ----------
    doEnter() {
      const { memberName, memberEmail } = this.state;
      if (!(memberName || '').trim() || !(memberEmail || '').trim()) { this.flash('Enter your name and email'); return; }
      google.script.run
        .withSuccessHandler(res => {
          if (!res.ok) { this.flash(res.error || 'Could not sign in'); return; }
          this.token = res.token;
          try { localStorage.setItem('sfj_token', this.token); } catch (e) {}
          this.setState({ memberName: '', memberEmail: '' });
          this.bootstrap();
        })
        .withFailureHandler(err => this.flash('Could not sign in: ' + ((err && err.message) || err)))
        .api_enter(memberName, memberEmail);
    }
    doLogin() {
      const { loginEmail, loginPass } = this.state;
      if (!(loginEmail || '').trim() || !(loginPass || '').trim()) { this.flash('Enter your administrator email and password'); return; }
      google.script.run
        .withSuccessHandler(res => {
          if (!res.ok) { this.flash(res.error || 'Sign-in failed'); return; }
          this.token = res.token;
          try { localStorage.setItem('sfj_token', this.token); } catch (e) {}
          this.setState({ loginPass: '', loginEmail: '', adminLoginOpen: false, page: 'journey' });
          this.bootstrap();
          this.flash('Signed in as administrator');
        })
        .withFailureHandler(err => this.flash('Sign-in failed: ' + ((err && err.message) || err)))
        .api_login(loginEmail, loginPass);
    }
    logout() {
      google.script.run.withFailureHandler(() => {}).api_logout(this.token);
      this.token = ''; try { localStorage.removeItem('sfj_token'); } catch (e) {}
      this.setState({ auth: null, favorites: {}, showFav: false, loginPass: '', selectedId: null, editing: null, page: 'journey' });
    }
    addAdmin() {
      const { naName, naEmail, naPass } = this.state;
      if (!(naName || '').trim() || !(naEmail || '').trim() || !(naPass || '').trim()) { this.flash('Fill in name, email, and password'); return; }
      google.script.run
        .withSuccessHandler(res => { this.setState({ admins: res.admins, naName: '', naEmail: '', naPass: '' }); this.flash('Administrator added'); })
        .withFailureHandler(err => this.flash((err && err.message) || String(err)))
        .api_addAdmin(this.token, naName, naEmail, naPass);
    }
    removeAdmin(email) {
      google.script.run
        .withSuccessHandler(res => { this.setState({ admins: res.admins }); this.flash('Administrator removed'); })
        .withFailureHandler(err => this.flash((err && err.message) || String(err)))
        .api_removeAdmin(this.token, email);
    }
    clearActivity() {
      if (!window.confirm('Clear all activity history?')) return;
      google.script.run
        .withSuccessHandler(() => { this.setState({ activity: [] }); this.flash('Activity history cleared'); })
        .withFailureHandler(err => this.flash((err && err.message) || String(err)))
        .api_clearActivity(this.token);
    }
    setSetting(patch) {
      this.setState({ settings: Object.assign({}, this.state.settings, patch) });
      google.script.run
        .withSuccessHandler(res => this.setState({ settings: res.settings }))
        .withFailureHandler(err => this.flash('Setting failed: ' + ((err && err.message) || err)))
        .api_setSetting(this.token, patch);
    }
    applyDataText() {
      let arr;
      try { arr = JSON.parse(this.state.dataText); if (!Array.isArray(arr)) throw new Error('data must be a JSON array'); }
      catch (e) { this.flash('Invalid JSON: ' + e.message); return; }
      google.script.run
        .withSuccessHandler(res => { this.setState({ companies: res.companies }); this.flash('Database updated (' + res.count + ' companies)'); })
        .withFailureHandler(err => this.flash('Update failed: ' + ((err && err.message) || err)))
        .api_importCompanies(this.token, arr);
    }

    flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2800); }
    industries() { return Array.from(new Set(this.state.companies.map(c => c.industry).filter(Boolean))).sort(); }
    engFiltered() {
      const term = this.state.engQ.trim().toLowerCase();
      const s = this.state.engSort;
      let out = this.ENG.filter(e => !term || e.company.toLowerCase().includes(term));
      out = out.slice().sort((a, b) => {
        let av = a[s.key], bv = b[s.key];
        if (typeof av === 'string') { av = av.toLowerCase(); bv = (bv || '').toLowerCase(); }
        if (av < bv) return -1 * s.dir; if (av > bv) return 1 * s.dir; return 0;
      });
      return out;
    }

    filtered() {
      const { companies, q, membership, industryFilter, stageFilter, sort } = this.state;
      const activeStages = Object.keys(stageFilter).filter(k => stageFilter[k]);
      const term = q.trim().toLowerCase();
      let out = companies.filter(c => {
        if (membership === 'ttpc' && !c.ttpc) return false;
        if (membership === 'adcouncil' && !c.adCouncil) return false;
        if (industryFilter !== 'all' && c.industry !== industryFilter) return false;
        if (this.state.showFav && !(this.state.favorites && this.state.favorites[c.id])) return false;
        if (activeStages.length) { const ok = activeStages.includes(c.overall) || (activeStages.includes('__none') && !c.overall); if (!ok) return false; }
        if (term) {
          const hay = [c.company, c.industry, c.overallWhy, c.doneTogether, (c.board || []).map(m => m.name + ' ' + m.title).join(' ')].join(' ').toLowerCase();
          if (!hay.includes(term)) return false;
        }
        return true;
      });
      const dir = sort.dir;
      out = out.slice().sort((a, b) => {
        let av, bv;
        if (sort.key === 'overall') { av = this.STAGES.indexOf(a.overall); bv = this.STAGES.indexOf(b.overall); }
        else { av = (a[sort.key] || '').toString().toLowerCase(); bv = (b[sort.key] || '').toString().toLowerCase(); }
        if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
      });
      return out;
    }

    // ---------- selection ----------
    toggleSelect(id) { this.setState(s => ({ selected: Object.assign({}, s.selected, { [id]: !s.selected[id] }) })); }
    selectAll(ids) { this.setState(s => { const n = Object.assign({}, s.selected); ids.forEach(i => n[i] = true); return { selected: n }; }); }
    unselect(ids) { this.setState(s => { const n = Object.assign({}, s.selected); ids.forEach(i => delete n[i]); return { selected: n }; }); }
    clearSelected() { this.setState({ selected: {} }); }
    selectedIds() { return Object.keys(this.state.selected).filter(k => this.state.selected[k]); }

    // ---------- share via email (client-side text building; excludes internal fields per CLAUDE.md) ----------
    shareText(detail) {
      const ids = this.selectedIds();
      const rows = ids.map(id => this.state.companies.find(c => c.id === id)).filter(Boolean);
      const lines = [];
      rows.forEach(c => {
        lines.push(c.company + ' — ' + c.overall);
        const mem = [c.ttpc ? 'TTPC partner' : null, c.adCouncil ? 'Ad Council board' : null].filter(Boolean).join(', ');
        if (mem) lines.push('  ' + mem);
        if (detail === 'full') {
          if (c.overallWhy) lines.push('  Why this classification: ' + c.overallWhy);
          this.CATS.forEach(k => { const cc = c.categories[k.key] || {}; lines.push('  - ' + k.label + ': ' + cc.cls + (cc.why ? ' — ' + cc.why : '')); });
          if (c.sources && c.sources.length) lines.push('  Sources: ' + c.sources.join('  |  '));
        }
        lines.push('');
      });
      return { rows, body: lines.join('\n') };
    }
    openEmail() {
      const { rows, body } = this.shareText(this.state.shareDetail);
      if (!rows.length) return;
      const msg = this.state.shareMsg.trim();
      const subject = 'Skills-first journey — ' + rows.length + (rows.length === 1 ? ' company' : ' companies');
      const full = (msg ? msg + '\n\n' : '') + body;
      const to = this.state.shareTo.trim();
      const enc = encodeURIComponent(full);
      if (enc.length > 1800) {
        if (navigator.clipboard) navigator.clipboard.writeText(full).catch(() => {});
        const shortBody = (msg ? msg + '\n\n' : '') + rows.map(c => '• ' + c.company + ' — ' + c.overall).join('\n') + '\n\n(Full details copied to your clipboard — paste them into the email body.)';
        window.location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(shortBody);
        this.flash('Email opened — full details copied to clipboard');
      } else {
        window.location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subject) + '&body=' + enc;
        this.flash('Opening your email client…');
      }
      this.setState({ shareOpen: false });
    }
    copyShare() {
      const { rows, body } = this.shareText(this.state.shareDetail);
      if (!rows.length) return;
      const msg = this.state.shareMsg.trim();
      const text = (msg ? msg + '\n\n' : '') + body;
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => this.flash('Copied ' + rows.length + ' companies to clipboard')).catch(() => this.flash('Copy failed — try Open email'));
      else this.flash('Clipboard not available');
    }

    // ---------- mutations (write through to the Sheet via SheetData.gs) ----------
    blank() { return this.norm({ company: '', overall: this.STAGES[0] }); }
    startAdd() { this.setState({ editing: this.blank(), isNew: true, selectedId: null }); }
    startEdit(c) { this.setState({ editing: JSON.parse(JSON.stringify(c)), isNew: false }); }
    cancelEdit() { this.setState({ editing: null }); }
    setEdit(patch) { this.setState(s => ({ editing: Object.assign({}, s.editing, patch) })); }
    setEditCat(key, patch) {
      this.setState(s => {
        const cats = Object.assign({}, s.editing.categories);
        cats[key] = Object.assign({}, cats[key], patch);
        return { editing: Object.assign({}, s.editing, { categories: cats }) };
      });
    }
    saveForm() {
      const e = this.state.editing;
      if (!e.company.trim()) { this.flash('Company name is required'); return; }
      google.script.run

      const rows = [cols.map(c => esc(c[0])).join(',')];

      const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });

    parseCSV(text) {
      const rows = []; let row = [], cur = '', q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
        else {
          if (ch === '"') q = true;
          else if (ch === ',') { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (ch === '\r') {}
          else cur += ch;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }
      return rows.filter(r => r.length && r.some(x => x !== ''));

          const rows = this.parseCSV(content);
          if (rows.length < 2) { this.flash('No rows found in CSV'); return; }
          const head = rows[0].map(h => h.trim());
          const idx = name => head.findIndex(h => h.toLowerCase() === name.toLowerCase());
          const yes = v => /^(yes|true|1|y)$/i.test((v || '').trim());
          const get = (r, name) => { const i = idx(name); return i >= 0 ? (r[i] || '').trim() : ''; };
          const out = rows.slice(1).map(r => {
            const cats = {};
            this.CATS.forEach(k => { cats[k.key] = { cls: get(r, k.label + ' — Classification') || this.STAGES[0], why: get(r, k.label + ' — Reasoning') }; });
            const sources = [];

            return this.norm({
              company: get(r, 'Company'), logo: get(r, 'Logo'),
              ttpc: yes(get(r, 'TTPC Partner')), adCouncil: yes(get(r, 'Ad Council Board Member')),
              doneTogether: get(r, "What We've Done Together"),
              overall: get(r, 'Overall Journey Classification') || this.STAGES[0], overallWhy: get(r, 'Overall Classification Reasoning'),
              categories: cats, international: get(r, 'International Context'),
              assessmentDate: get(r, 'Assessment Date'), sources,
            });
          }).filter(c => c.company);
          if (!out.length) { this.flash('No valid company rows found'); return; }
          google.script.run
            .withSuccessHandler(res => { this.setState({ companies: res.companies, selected: {} }); this.flash('Imported ' + res.count + ' companies'); })
            .withFailureHandler(err => this.flash('Import failed: ' + ((err && err.message) || err)))

          h('p', { className: 'u-text-style-large u-mt-4 u-text-wrap-pretty', style: { maxWidth: '58ch', marginBottom: '2.5rem' } }, 'A working menu for Ad Council board members — from a first, no-cost step to what’s exclusive to the board.'),
          resourceSection('Universal menu', 'How any board member can support skills-first hiring', RES.universalMenu, '#8c4799'),
          resourceSection('Before joining TTPC', 'Turnkey ways to support the movement first', RES.turnkey, '#56adde'),
          resourceSection('Board-only', 'Exclusive resources for Ad Council board members', RES.exclusive, '#e03c32')));

      const pageEl = st.page === 'priority' ? priorityPage
        : st.page === 'resources' ? resourcesPage
        : st.page === 'engagement' ? engagement
        : st.page === 'definitions' ? definitionsPage
        : (st.page === 'activity' && isAdmin) ? activityPage
        : (st.page === 'admin' && isAdmin) ? adminPage
        : journey;

      // ---- ADMIN LOGIN MODAL ---- (everyone else browses freely; this is the only way in)
      const closeAdminLogin = () => this.setState({ adminLoginOpen: false, loginEmail: '', loginPass: '' });
      const adminLoginModal = st.adminLoginOpen ? h('div', { onClick: closeAdminLogin, style: { position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(15,21,59,.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }, className: 'sfj-fade' },
        h('div', { onClick: ev => ev.stopPropagation(), style: { width: 'min(380px, 96vw)', background: '#fff', borderRadius: '1rem', boxShadow: '0 20px 60px rgba(0,0,0,.25)', overflow: 'hidden' } },
          h('div', { style: { padding: '1.25rem 1.75rem', borderBottom: '1.5px solid rgba(28,28,28,.1)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
            h('span', { className: 'u-text-style-h6 u-weight-medium' }, 'Administrator sign-in'),
            h('button', { onClick: closeAdminLogin, style: { cursor: 'pointer', border: 'none', background: '#f0f0ee', borderRadius: '100vw', width: '2.2rem', height: '2.2rem', fontSize: '1.1rem' } }, '×')),
          h('form', { onSubmit: e => { e.preventDefault(); this.doLogin(); }, style: { padding: '1.75rem', display: 'flex', flexDirection: 'column', gap: '1rem' } },
            h('div', null, lbl('Email'), h('input', { type: 'email', autoFocus: true, value: st.loginEmail, onChange: e => this.setState({ loginEmail: e.target.value }), placeholder: 'admin@opportunityatwork.org', style: inputStyle })),
            h('div', null, lbl('Password'), h('input', { type: 'password', value: st.loginPass, onChange: e => this.setState({ loginPass: e.target.value }), placeholder: 'Password', style: inputStyle })),
            h('button', { type: 'submit', style: { cursor: 'pointer', fontFamily: 'inherit', fontSize: '.9rem', fontWeight: 500, padding: '.7rem', borderRadius: '100vw', border: '1.5px solid ' + ACC, background: ACC, color: '#fff', marginTop: '.15rem' } }, 'Sign in')))) : null;

      return h(F, null, nav, pageEl, drawer, engPopup, form, shareBar, shareModal, adminLoginModal, toast, hiddenFile);
    }

    // ---------- entry gate screen ----------
    // Shown instead of the app whenever there's no valid session. No
    // password — just name + email — but the email is checked server-side
    // (api_enter, Auth.gs) against ALLOWED_EMAIL_DOMAINS (Config.gs), so
    // this is what actually restricts who can see the site at all.
    // Administrators enter here too (their email already qualifies), then
    // use the "Admin login" button in the nav once inside to elevate.
    entryScreen(ACC) {
      const st = this.state;
      const inp = { width: '100%', padding: '.7rem 1rem', borderRadius: '.6rem', border: '1.5px solid rgba(28,28,28,.18)', fontFamily: 'inherit', fontSize: '.95rem', background: '#fff', boxSizing: 'border-box' };
      const lab = t => h('div', { style: { fontSize: '.78rem', fontWeight: 600, color: '#4a4e60', marginBottom: '.35rem' } }, t);
      const submit = e => { e.preventDefault(); this.doEnter(); };
      return h('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem 1rem', background: '#f9f9f7' } },
        h('div', { style: { width: 'min(440px, 96vw)' } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '.9rem', justifyContent: 'center', marginBottom: '1.5rem' } },
            h('img', { src: window.SFJ_LOGO_DATA_URI, alt: 'Opportunity@Work', style: { height: '2.25rem', width: 'auto' } })),
          h('div', { className: 'card', style: { background: '#fff', padding: '2rem' } },
            h('h1', { className: 'u-text-style-h5 u-weight-medium', style: { margin: 0, textAlign: 'center' } }, (st.settings && st.settings.title) || 'Skills-First Journey Tracker'),
            h('p', { className: 'u-text-style-small u-color-faded', style: { textAlign: 'center', marginTop: '.4rem', marginBottom: '1.5rem' } }, 'For Opportunity@Work and Ad Council'),
            h('form', { onSubmit: submit, style: { display: 'flex', flexDirection: 'column', gap: '1rem' } },
              h('div', null, lab('Your name'), h('input', { value: st.memberName, onChange: e => this.setState({ memberName: e.target.value }), placeholder: 'Jane Doe', style: inp })),
              h('div', null, lab('Email'), h('input', { type: 'email', value: st.memberEmail, onChange: e => this.setState({ memberEmail: e.target.value }), placeholder: 'you@opportunityatwork.org', style: inp })),
              h('button', { type: 'submit', style: { cursor: 'pointer', fontFamily: 'inherit', fontSize: '.95rem', fontWeight: 500, padding: '.75rem', borderRadius: '100vw', border: '1.5px solid ' + ACC, background: ACC, color: '#fff', marginTop: '.25rem' } }, 'Continue')),
            h('p', { className: 'u-text-style-small u-color-faded', style: { textAlign: 'center', marginTop: '1.25rem', marginBottom: 0, lineHeight: 1.5 } }, 'Access is restricted to @opportunityatwork.org and @adcouncil.org email addresses.')),
          st.toast ? h('div', { className: 'sfj-fade', style: { textAlign: 'center', marginTop: '1rem', color: '#e03c32', fontSize: '.85rem' } }, st.toast) : null));
    }
  }

  const root = ReactDOM.createRoot(document.getElementById('sfj-root'));
  root.render(h(App));
})();
</script>
