/* ============================================================================

   Primary pairing is purple + navy + white/off-white. The other six brand
   colors are an accent set used sparingly (category coding, shapes, illos).
   Each color ships a matching `…-text` token with the accessible text color.
   ========================================================================== */
:root {

  /* Neutrals / surfaces */
  --swatch--dark: #0f153b;             /* deep navy — primary dark surface + body text */
  --swatch--dark-secondary: #000000;
  --swatch--dark-faded: rgba(28, 28, 28, 0.1);

  --swatch--light: #ffffff;
  --swatch--light-secondary: #f9f9f7;  /* warm off-white — alt section background */

  --swatch--brand-1-faded: #fff6ff;
  --swatch--brand-1-text: var(--swatch--light);

  /* Brand — secondary */
  --swatch--brand-2: #e87722;          /* ORANGE — secondary brand */
  --swatch--brand-2-text: var(--swatch--light);

  /* Brand — accent set (use sparingly) */
  --swatch--brand-3: #9bd3dd;          /* light cyan */
  --swatch--brand-3-text: var(--swatch--dark);

  --swatch--brand-4: #e3e48d;          /* chartreuse / yellow-green */
  --swatch--brand-4-text: var(--swatch--dark);

  --swatch--brand-5: #e03c32;          /* red */
  --swatch--brand-5-text: var(--swatch--light);

  --swatch--brand-6: #56adde;          /* blue */
  --swatch--brand-6-text: var(--swatch--dark);

  --swatch--brand-7: #ffae32;          /* amber / gold */

  --swatch--brand-8: #fe7340;          /* coral */
  --swatch--brand-8-text: var(--swatch--light);
}
/* ============================================================================
   SPACING, RADIUS & LAYOUT — the O@W rhythm
   Generous section padding (7rem default), a 1440px max grid, pill buttons,
   and 1rem rounded media are the structural signatures of the brand.
   ========================================================================== */
:root {
  /* Size scale (rem) — primitive steps */
  --size--0rem: 0rem;
  --size--0-125rem: 0.125rem;
  --size--0-25rem: 0.25rem;
  --size--0-375rem: 0.375rem;
  --size--0-5rem: 0.5rem;
  --size--0-75rem: 0.75rem;
  --size--1rem: 1rem;
  --size--1-25rem: 1.25rem;
  --size--1-5rem: 1.5rem;
  --size--2rem: 2rem;
  --size--2-5rem: 2.5rem;
  --size--3rem: 3rem;
  --size--3-5rem: 3.5rem;
  --size--4rem: 4rem;
  --size--4-5rem: 4.5rem;
  --size--5rem: 5rem;
  --size--5-5rem: 5.5rem;
  --size--6rem: 6rem;
  --size--6-5rem: 6.5rem;
  --size--7rem: 7rem;
  --size--7-5rem: 7.5rem;
  --size--8rem: 8rem;
  --size--10rem: 10rem;
  --size--12rem: 12rem;
  --size--16rem: 16rem;

  /* Spacing scale (semantic) — 0.25 · 0.5 · 0.75 · 1 · 1.5 · 2 · 3 · 4 rem */
  --space--1: var(--size--0-25rem);
  --space--2: var(--size--0-5rem);
  --space--3: var(--size--0-75rem);
  --space--4: var(--size--1rem);
  --space--5: var(--size--1-5rem);
  --space--6: var(--size--2rem);
  --space--7: var(--size--3rem);
  --space--8: var(--size--4rem);

  /* Section vertical rhythm */
  --section-space--none: var(--size--0rem);
  --section-space--small: var(--size--5rem);   /* 80px  */
  --section-space--main: var(--size--7rem);    /* 112px */
  --section-space--large: var(--size--10rem);  /* 160px */

  /* Radius */
  --radius--small: 0.5rem;
  --radius--main: 1rem;
  --radius--round: 100vw;   /* pills / circles */

  /* Layout / site frame */

/* ============================================================================

   The signature O@W move: headings are set in MEDIUM (500), NOT bold, with

  --font--primary-regular: 400;
  --font--primary-medium: 500;       /* headings use this — never bold */
  --font--primary-semi-bold: 600;

  --letter-spacing--tight: -0.03em;  /* headings */

  /* Line heights */
  --line-height--1: 1;
  --line-height--1-1: 1.1;
  --line-height--1-3: 1.3;
  --line-height--1-5: 1.5;

  /* Type scale — font sizes */

  --h1--font-size: var(--size--5rem);            /* 80px  */
  --h2--font-size: var(--size--4rem);            /* 64px  */
  --h3--font-size: var(--size--3rem);            /* 48px  */
  --h4--font-size: var(--size--2rem);            /* 32px  */

  --h6--font-size: var(--size--1rem);            /* 16px  */

  --heading--font-weight: var(--font--primary-medium);   /* MEDIUM, not bold */
  --heading--letter-spacing: var(--letter-spacing--tight);

    --h1--font-size: var(--size--4rem);
    --h2--font-size: var(--size--3rem);

   Sections recolor as a unit. Default theme = light surface / dark text.
   Apply a `u-theme-*` helper (see base/utilities.css) to a section and

  --theme--text: var(--swatch--dark);

/* ============================================================================
   RESPONSIVE — the O@W mobile standard
   ----------------------------------------------------------------------------
   Build desktop-first, then reach for these modifiers to control STACKING,
   COLUMN SPANS, VISIBILITY, ALIGNMENT, and TOUCH TARGETS at each breakpoint.
   Every layout built with this system should pass through these decisions in
   the build phase — not get "made responsive" later.

   Three breakpoints, inherited from the original Webflow build:

     --bp--tablet            991px   ≤ tablet / small laptop
     --bp--mobile-landscape  767px   ≤ large phone / portrait tablet  (where
                                     multi-column grids collapse to one)
     --bp--mobile            479px   ≤ phone (type + gutter fine-tuning)

   CSS media queries can't read custom properties, so the px values are
   repeated literally below. Keep them in sync with these tokens.
   ========================================================================== */

  --bp--tablet: 991px;
  --bp--mobile-landscape: 767px;
  --bp--mobile: 479px;

  /* Minimum interactive target on touch devices (44px) */
  --touch-target--min: 2.75rem;
}

/* ----------------------------------------------------------------------------
   1 · STACKING — turn a flex row into a column at a breakpoint.
   Add to any element that is already a flex row (e.g. u-hflex-*).
   Stacking is sticky: a tablet stack stays stacked on mobile too.
   -------------------------------------------------------------------------- */
@media (max-width: 991px) {
  .u-stack-tablet { flex-direction: column; align-items: stretch; }
}
@media (max-width: 767px) {
  .u-stack-mobile { flex-direction: column; align-items: stretch; }
}

/* Reverse the visual order when a row stacks (e.g. media-above-text on mobile) */
@media (max-width: 767px) {
  .u-order-first-mobile { order: -1; }
  .u-order-last-mobile  { order: 1; }
}

/* ----------------------------------------------------------------------------
   2 · COLUMN SPANS per breakpoint — for the 12-column .u-grid-desktop.
   The tablet band keeps all 12 tracks, so explicit spans are meaningful there;
   scoped to 768–991 so they never override the single-column mobile stack.
   On phones every grid collapses to one column by default (the stacking
   standard); use .u-grid-mobile-2 to deliberately keep a 2-up for tight pairs.
   -------------------------------------------------------------------------- */
@media (min-width: 768px) and (max-width: 991px) {
  .u-column-tablet-1  { grid-column: span 1; }
  .u-column-tablet-2  { grid-column: span 2; }
  .u-column-tablet-3  { grid-column: span 3; }
  .u-column-tablet-4  { grid-column: span 4; }
  .u-column-tablet-5  { grid-column: span 5; }
  .u-column-tablet-6  { grid-column: span 6; }
  .u-column-tablet-7  { grid-column: span 7; }
  .u-column-tablet-8  { grid-column: span 8; }
  .u-column-tablet-9  { grid-column: span 9; }
  .u-column-tablet-10 { grid-column: span 10; }
  .u-column-tablet-11 { grid-column: span 11; }
  .u-column-tablet-12 { grid-column: span 12; }
}

@media (max-width: 767px) {
  /* Re-establish a 2-up grid on phones for tight pairs (stats, logos) */
  .u-grid-mobile-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .u-grid-mobile-2 > [class*="u-column-"] { grid-column: span 1 !important; }
}

/* ----------------------------------------------------------------------------
   3 · VISIBILITY — show/hide by breakpoint.
   *-hide-*  removes the element at or below a breakpoint.

   Pair u-hide-mobile (desktop nav) with u-only-mobile (hamburger menu).
   -------------------------------------------------------------------------- */

@media (max-width: 767px) { .u-hide-mobile { display: none !important; } }

@media (min-width: 992px) { .u-only-tablet-down { display: none !important; } }
@media (min-width: 768px) { .u-only-mobile      { display: none !important; } }

/* ----------------------------------------------------------------------------
   4 · ALIGNMENT — re-center or re-align content once it stacks.
